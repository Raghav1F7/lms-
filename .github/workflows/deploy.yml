name: Deploy to Render

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set image metadata
        id: meta
        run: |
          IMAGE_TAG=${GITHUB_SHA}
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_NAME}:${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        run: |
          docker build --file Dockerfile --tag "${{ steps.meta.outputs.image_ref }}" .
          docker push "${{ steps.meta.outputs.image_ref }}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${{ steps.meta.outputs.image_ref }}")
          echo "image_digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Trigger Render web deploy
        id: web_deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || (echo "Missing RENDER_DEPLOY_HOOK_URL" && exit 1)
          WEB_RESPONSE=$(curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL")
          echo "response<<EOF" >> "$GITHUB_OUTPUT"
          echo "$WEB_RESPONSE" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Trigger Render worker deploy (optional)
        id: worker_deploy
        env:
          RENDER_WORKER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_WORKER_DEPLOY_HOOK_URL" ]; then
            WORKER_RESPONSE=$(curl -fsS -X POST "$RENDER_WORKER_DEPLOY_HOOK_URL")
            echo "status=triggered" >> "$GITHUB_OUTPUT"
            echo "response<<EOF" >> "$GITHUB_OUTPUT"
            echo "$WORKER_RESPONSE" >> "$GITHUB_OUTPUT"
            echo "EOF" >> "$GITHUB_OUTPUT"
          else
            echo "status=not_configured" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for rollout window
        run: sleep 30

      - name: Health check
        id: health
        env:
          PRODUCTION_HEALTHCHECK_URL: ${{ secrets.PRODUCTION_HEALTHCHECK_URL }}
        run: |
          test -n "$PRODUCTION_HEALTHCHECK_URL" || (echo "Missing PRODUCTION_HEALTHCHECK_URL" && exit 1)
          HTTP_CODE=$(curl -sS -o /tmp/health-response.txt -w "%{http_code}" "$PRODUCTION_HEALTHCHECK_URL")
          echo "http_code=$HTTP_CODE" >> "$GITHUB_OUTPUT"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Health check failed with HTTP $HTTP_CODE"
            cat /tmp/health-response.txt
            exit 1
          fi

      - name: Deployment report
        if: always()
        env:
          WEB_DEPLOY_RESPONSE: ${{ steps.web_deploy.outputs.response }}
          WORKER_DEPLOY_STATUS: ${{ steps.worker_deploy.outputs.status }}
          HEALTH_CODE: ${{ steps.health.outputs.http_code }}
          JOB_STATUS: ${{ job.status }}
        run: |
          HEALTH_STATUS="FAIL"
          if [ "$HEALTH_CODE" = "200" ]; then
            HEALTH_STATUS="PASS"
          fi

          MIGRATION_STATUS="Manual/Render release command"
          ROLLBACK_STATUS="Available (redeploy previous image tag)"

          {
            echo "DEPLOYMENT REPORT"
            echo "-----------------"
            echo "Commit: $GITHUB_SHA"
            echo "Image Tag: ${{ steps.meta.outputs.image_tag }}"
            echo "Image Digest: ${{ steps.build.outputs.image_digest }}"
            echo "Render Service: web (worker: ${WORKER_DEPLOY_STATUS:-unknown})"
            echo "Healthcheck: ${HEALTH_STATUS} (HTTP ${HEALTH_CODE:-N/A})"
            echo "Migration Status: $MIGRATION_STATUS"
            echo "Rollback Available: $ROLLBACK_STATUS"
            echo "Status: ${JOB_STATUS^^}"
          } >> "$GITHUB_STEP_SUMMARY"
